<!DOCTYPE html>
<html lang="en">
<head>

<meta property="og:description" content="Practical weekly articles on FP&amp;A, controls, month-end close, AI in finance and finance careers.">
<meta property="og:image" content="https://mohamedyacoub.com/assets/og-default.png">
<meta property="og:url" content="https://mohamedyacoub.com/">

<script>/* apply saved theme before paint, so there is no flash */(function(){var t=localStorage.getItem('fi_theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;
/* old #/ links → clean links */var h=location.hash;if(h.indexOf('#/admin')===0){location.replace('/admin/'+h.replace('#/admin','#'))}else if(h.indexOf('#/post/')===0){history.replaceState(null,'','/post/'+h.slice(7))}})();</script>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/common.js"></script>
<style>
:root{--bg:var(--cream-l);--surface:#fff;--surface2:#fbf9f3;--text:var(--ink);--muted:#5d7273;--line:rgba(10,46,47,.1);--chip:#fff}
[data-theme=dark]{--bg:#061b1c;--surface:#0b2829;--surface2:#0e3031;--text:#e6efed;--muted:#9db5b2;--line:rgba(255,255,255,.09);--chip:#0b2829;--prose:#d6e4e1;--h2:#9dc9ca;--h3:#7eb5b6;--strong:#fff}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);transition:background .25s,color .25s}

/* header */
.nav{position:sticky;top:0;z-index:40;background:linear-gradient(135deg,var(--teal-600),var(--teal-850));border-bottom:1px solid rgba(201,168,106,.35)}
.nav .in{max-width:1220px;margin:auto;display:flex;align-items:center;gap:18px;padding:12px 24px}
.links{margin-left:auto;display:flex;gap:4px;align-items:center}
.links a{padding:9px 14px;border-radius:999px;font-size:14px;font-weight:600;color:#d7e6e4;text-decoration:none}
.links a:hover{background:rgba(255,255,255,.09);color:#fff}
.links a.sub{background:var(--gold);color:var(--teal-900);display:flex;gap:7px;align-items:center}
.links a.sub:hover{background:var(--gold-l)}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.07);font-size:17px}
.ibtn:hover{background:rgba(255,255,255,.14)}
.menu-btn{display:none}
.mnav{display:none;flex-direction:column;padding:6px 16px 16px;gap:2px}
.mnav a{color:#e3eeec;text-decoration:none;padding:13px 12px;border-radius:10px;font-weight:600}
.mnav a:hover{background:rgba(255,255,255,.08)}
.nav.open .mnav{display:flex}
.progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-l));width:0;z-index:60;transition:width .1s linear}

/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--teal-700),var(--teal-800) 55%,var(--teal-900));color:#fff}
.hero::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 1px,transparent 1px 22px)}
.glow{position:absolute;border-radius:50%;filter:blur(80px);opacity:.22}
.hero .in{position:relative;max-width:1220px;margin:auto;padding:60px 24px 70px;display:grid;grid-template-columns:1.05fr 1fr;gap:52px;align-items:center}
.kicker{display:inline-flex;gap:8px;align-items:center;font-size:12px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold);border:1px solid rgba(201,168,106,.45);padding:7px 13px;border-radius:999px}
.kicker i{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.3}}
.hero h1{font-size:clamp(36px,5vw,60px);font-weight:900;line-height:1.04;letter-spacing:-1.5px;margin:20px 0 18px}
.hero h1 span{color:var(--gold)}
.hero p.lead{font-size:18px;line-height:1.6;color:#c9dbd9;max-width:520px}
.stats{display:flex;gap:34px;margin-top:30px;flex-wrap:wrap}
.stats b{display:block;font-size:30px;font-weight:900}
.stats span{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--teal-200)}
.featured{display:block;text-decoration:none;background:var(--surface);color:var(--text);border-radius:22px;overflow:hidden;box-shadow:0 30px 70px -20px rgba(0,0,0,.55);transition:transform .3s}
.featured:hover{transform:translateY(-5px)}
.featured .cover{height:270px}
.featured .body{padding:22px 26px 26px}
.featured h2{font-family:var(--serif);font-size:25px;line-height:1.22;margin:10px 0}
.featured p{color:var(--muted);line-height:1.55}
.ticker{background:var(--teal-900);color:#cfe0de;white-space:nowrap;overflow:hidden;padding:12px 0;font-size:13px;border-top:1px solid rgba(201,168,106,.25)}
.ticker .track{display:inline-block;animation:scroll 60s linear infinite}
.ticker:hover .track{animation-play-state:paused}
.ticker a{margin:0 26px;text-decoration:none}.ticker a:hover{color:#fff}.ticker b{color:var(--gold)}
@keyframes scroll{to{transform:translateX(-50%)}}

/* home */
.home{max-width:1220px;margin:auto;padding:44px 24px 70px;display:grid;grid-template-columns:1fr 310px;gap:40px}
.sec-h{display:flex;align-items:end;justify-content:space-between;margin-bottom:16px}
.sec-h h3{font-size:24px;font-weight:900;letter-spacing:-.4px}
.sec-h small{color:var(--muted);font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:24px}
.chip{padding:8px 15px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;background:var(--chip);display:flex;gap:7px;align-items:center;color:var(--text)}
.chip i{width:8px;height:8px;border-radius:50%}
.chip:hover{border-color:var(--teal-400)}
.chip.on{background:var(--teal-700);color:#fff;border-color:var(--teal-700)}
.search{margin-left:auto;position:relative}
.search input{padding:10px 14px 10px 36px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--text);width:240px;outline:none}
.search input:focus{border-color:var(--gold)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.55}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:24px}
.card{background:var(--surface);border-radius:var(--r);overflow:hidden;transition:.25s;border:1px solid var(--line);display:flex;flex-direction:column;text-decoration:none;color:var(--text)}
.card:hover{transform:translateY(-4px);box-shadow:0 22px 44px -20px rgba(6,38,40,.5)}
.card .cover{height:150px}.card .cover .ttl{display:none}
.card .body{padding:18px 20px 20px;display:flex;flex-direction:column;flex:1}
.card h4{font-family:var(--serif);font-size:19px;line-height:1.3;margin:8px 0}
.card p{font-size:14px;color:var(--muted);line-height:1.55;flex:1}
.card .foot{display:flex;justify-content:space-between;margin-top:14px;font-size:12px;color:var(--muted)}
.meta{font-size:12.5px;color:var(--muted);display:flex;gap:9px;align-items:center;flex-wrap:wrap;font-weight:500}
.meta .dot{width:3px;height:3px;border-radius:50%;background:currentColor}
.meta b{color:var(--teal-400);letter-spacing:1px;font-size:11px}
.more{display:flex;justify-content:center;margin-top:30px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:12px;font-weight:700;font-size:14px;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--text)}
.btn:hover{border-color:var(--gold)}
.btn.li{background:#0a66c2;border-color:#0a66c2;color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--teal-900)}
.empty{padding:60px;text-align:center;color:var(--muted);background:var(--surface);border-radius:var(--r);grid-column:1/-1;border:1px solid var(--line)}
.side .box{background:var(--surface);border-radius:var(--r);padding:22px;margin-bottom:22px;border:1px solid var(--line)}
.side h5{font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:14px;color:var(--teal-400)}
.brandbox{background:linear-gradient(135deg,var(--teal-700),var(--teal-900))!important;color:#fff;text-align:center;border:none!important}
.brandbox .mark{width:74px;height:74px;margin:4px auto 12px;display:block}
.brandbox p{color:#c9dbd9;font-size:14px;line-height:1.5;margin:10px 0 16px}
.li-cta{display:flex;align-items:center;justify-content:center;gap:8px;background:#0a66c2;color:#fff;padding:11px;border-radius:12px;font-weight:700;font-size:14px;text-decoration:none}
.li-cta:hover{background:#0958a8}
.up-item{display:flex;gap:14px;padding:11px 0;border-bottom:1px dashed var(--line)}
.up-item:last-child{border:none}
.up-date{min-width:50px;text-align:center;background:rgba(201,168,106,.16);border-radius:10px;padding:6px 4px}
.up-date b{display:block;font-size:20px;font-weight:900}
.up-date span{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--teal-400);font-weight:800}
.up-item p{font-size:14px;font-weight:700;line-height:1.35}
.up-item small{font-size:12px;color:var(--muted)}
.topic-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:14px;font-weight:600;width:100%;text-align:left}
.topic-row:hover{color:var(--teal-400)}
.topic-row i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:9px}
.topic-row span{background:rgba(201,168,106,.16);border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700}
.author{display:flex;gap:14px;align-items:center}
.avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#a88947);display:grid;place-items:center;color:var(--teal-900);font-weight:900;font-size:18px;flex-shrink:0}
.author b{font-size:16px}.author small{display:block;color:var(--muted);font-size:13px;margin-top:2px}

/* article */
.art-wrap{max-width:1180px;margin:auto;padding:30px 24px 80px;display:grid;grid-template-columns:minmax(0,780px) 250px;gap:56px;justify-content:center}
.crumbs{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:20px;font-weight:600}
.crumbs a{text-decoration:none}.crumbs a:hover{color:var(--teal-400)}
.article .cover{height:340px;border-radius:22px;margin-bottom:30px}
.article .cover .ttl{font-size:30px}
.article h1{font-family:var(--serif);font-size:clamp(30px,4.4vw,46px);line-height:1.12;letter-spacing:-.6px;margin:14px 0}
.article .excerpt{font-family:var(--serif);font-size:21px;line-height:1.5;color:var(--h2,var(--teal-600));margin-bottom:24px;border-left:4px solid var(--gold);padding-left:18px}
.article .prose{margin-top:30px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin:36px 0 24px}
.tag{font-size:13px;background:var(--surface);border:1px solid var(--line);padding:5px 12px;border-radius:999px;color:var(--teal-400);font-weight:600}
.share{display:flex;gap:10px;align-items:center;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);flex-wrap:wrap}
.share b{font-size:14px;margin-right:4px}
.sbtn{display:inline-flex;gap:8px;align-items:center;padding:9px 14px;border-radius:10px;font-size:13px;font-weight:700;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--text)}
.sbtn.li{background:#0a66c2;color:#fff;border-color:#0a66c2}
.subscribe{margin:36px 0;border-radius:20px;padding:28px;background:linear-gradient(135deg,var(--teal-700),var(--teal-900));color:#fff;display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;position:relative;overflow:hidden}
.subscribe::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 1px,transparent 1px 20px)}
.subscribe>*{position:relative}
.subscribe .mark{width:62px;height:62px}
.subscribe h4{font-size:20px;font-weight:900}
.subscribe p{color:#c9dbd9;font-size:14px;margin-top:4px;line-height:1.5}
.related h3{font-size:20px;font-weight:900;margin:38px 0 16px}
.related .grid{grid-template-columns:repeat(3,1fr)}
.related .card .cover{height:120px}
.navpair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}
.navpair a{background:var(--surface);padding:18px;border-radius:14px;border:1px solid var(--line);text-decoration:none}
.navpair a:hover{border-color:var(--gold)}
.navpair small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
.navpair p{font-family:var(--serif);font-weight:700;margin-top:4px}
.toc{position:sticky;top:96px;align-self:start;max-height:calc(100vh - 120px);overflow:auto;padding-top:8px}
.toc h6{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:12px}
.toc a{display:block;font-size:13.5px;line-height:1.4;padding:7px 0 7px 14px;border-left:2px solid var(--line);color:var(--muted);text-decoration:none;transition:.15s}
.toc a.l3{padding-left:26px;font-size:12.5px}
.toc a:hover{color:var(--text)}
.toc a.on{color:var(--text);border-left-color:var(--gold);font-weight:700}
.toc .rt{margin-top:18px;font-size:12px;color:var(--muted)}
.banner{background:linear-gradient(90deg,var(--gold),var(--gold-l));color:var(--teal-900);text-align:center;padding:10px 16px;font-weight:700;font-size:14px}
.fab{position:fixed;right:22px;bottom:22px;z-index:50;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.fab button,.fab a{width:48px;height:48px;border-radius:50%;background:var(--teal-700);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(0,0,0,.25);font-size:18px;text-decoration:none;border:1px solid rgba(201,168,106,.4)}
.fab .edit{width:auto;border-radius:999px;padding:0 18px;font-size:14px;font-weight:700;background:var(--gold);color:var(--teal-900)}
.fab .top{opacity:0;pointer-events:none;transform:translateY(10px);transition:.25s}
.fab .top.show{opacity:1;pointer-events:auto;transform:none}
footer{background:var(--teal-900);color:#9fb7b5;padding:44px 24px;text-align:center;font-size:14px;border-top:3px solid var(--gold)}
footer .brand{justify-content:center;margin-bottom:14px}
footer nav{display:flex;gap:18px;justify-content:center;margin:12px 0 16px;flex-wrap:wrap}
footer nav a{color:#cfe0de;text-decoration:none;font-weight:600}
.nf{max-width:640px;margin:auto;padding:90px 24px;text-align:center}
.nf h1{font-size:40px;font-weight:900;margin:16px 0 10px}
.nf p{color:var(--muted);margin-bottom:24px}

@media(max-width:1180px){.art-wrap{grid-template-columns:minmax(0,780px)}.toc{display:none}}
@media(max-width:920px){.hero .in,.home{grid-template-columns:1fr}.links{display:none}.menu-btn{display:grid}.nav .in{gap:10px}.nav .tools{margin-left:auto}.search{margin-left:0;width:100%}.search input{width:100%}.related .grid{grid-template-columns:1fr}.subscribe{grid-template-columns:1fr;text-align:center}.subscribe .mark{margin:auto}}
@media(max-width:600px){.featured .cover .ttl{display:none}.featured .cover{height:180px}.hero .in{padding:40px 18px 48px}.home{padding:30px 16px 50px}.art-wrap{padding:20px 16px 60px}.article .cover{height:210px;border-radius:16px}.article .cover .ttl{font-size:19px}.prose{font-size:17.5px}.featured .cover{height:200px}.navpair{grid-template-columns:1fr}.fab{right:14px;bottom:14px}.stats{gap:22px}}
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<header class="nav" id="nav"></header>
<main id="view"><section class="hero"><div class="in"><div><div class="skel" style="height:30px;width:220px"></div><div class="skel" style="height:120px;margin:24px 0"></div><div class="skel" style="height:60px;width:80%"></div></div><div class="skel" style="height:380px;border-radius:22px"></div></div></section></main>
<div class="fab"><a class="edit" id="editBtn" style="display:none">✎ Edit issue</a><button class="top" id="topBtn" aria-label="Back to top" onclick="scrollTo({top:0,behavior:'smooth'})">↑</button></div>
<footer id="foot"></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const LI_ICON='<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 110-4.12 2.06 2.06 0 010 4.12zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>';
const SEARCH_ICON='<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l4 4"/></svg>';
const PAGE=9;
let filter='All', query='', shown=PAGE, homeScroll=0, spy=null;
const live=()=>S.posts.filter(isLive).sort((a,b)=>new Date(b.publishAt)-new Date(a.publishAt));
const upcoming=()=>(CLOUD?S.upcoming:S.posts.filter(p=>p.status==='scheduled'&&!isLive(p)).sort((a,b)=>new Date(a.publishAt)-new Date(b.publishAt)));
const cats=()=>{const m={};live().forEach(p=>m[p.category]=(m[p.category]||0)+1);return m};

/* ---------- shell ---------- */
function renderShell(){
  const s=S.settings, dark=document.documentElement.dataset.theme==='dark';
  $('#nav').innerHTML=`<div class="in">${brandHTML('','/')}
    <nav class="links" aria-label="Main"><a href="/" data-link data-scroll="issues">Issues</a><a href="/" data-link data-scroll="topics">Topics</a>
      <a class="sub" href="${esc(s.linkedin)}" target="_blank" rel="noopener">${LI_ICON} Subscribe</a></nav>
    <div class="tools" style="display:flex;gap:8px"><button class="ibtn" id="themeBtn" aria-label="Switch light or dark mode" onclick="toggleTheme()">${dark?'☀':'☾'}</button>
    <button class="ibtn menu-btn" aria-label="Menu" onclick="$('#nav').classList.toggle('open')">☰</button></div></div>
    <div class="mnav"><a href="/" data-link data-scroll="issues">Issues</a><a href="/" data-link data-scroll="topics">Topics</a><a href="${esc(s.linkedin)}" target="_blank" rel="noopener">Subscribe on LinkedIn</a></div>`;
  $('#foot').innerHTML=`${brandHTML(s.tagline,'/')}<nav><a href="/" data-link>All issues</a><a href="${esc(s.linkedin)}" target="_blank" rel="noopener">LinkedIn newsletter</a></nav>
    <div>© ${now().getFullYear()} ${esc(s.author)} · ${esc(s.blogName)}</div>`;
}
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('fi_theme',t);$('#themeBtn').textContent=t==='dark'?'☀':'☾'}
function setMeta(title,desc){document.title=title;const m=document.querySelector('meta[name=description]');if(m&&desc)m.setAttribute('content',desc)}

/* ---------- router (clean links: /  and  /post/slug) ---------- */
function nav(href,opts={}){ if(location.pathname==='/'||location.pathname==='/index.html') homeScroll=scrollY;
  history.pushState({},'',href); render(opts) }
document.addEventListener('click',e=>{
  const a=e.target.closest('a[data-link]'); if(!a||e.ctrlKey||e.metaKey||e.shiftKey||a.target==='_blank')return;
  e.preventDefault(); $('#nav').classList.remove('open'); nav(a.getAttribute('href'),{scrollTo:a.dataset.scroll});
});
window.addEventListener('popstate',()=>render({back:true}));
function render(opts={}){
  if(spy){spy.disconnect();spy=null}
  $('#progress').style.width='0'; $('#editBtn').style.display='none';
  const path=decodeURIComponent(location.pathname.replace(/\/index\.html$/,'/'));
  const m=path.match(/^\/post\/([^/]+)\/?$/);
  if(m) renderPost(m[1]);
  else if(path==='/'||path==='') renderHome();
  else renderNotFound();
  if(opts.scrollTo){ requestAnimationFrame(()=>document.getElementById(opts.scrollTo)?.scrollIntoView({behavior:'smooth'})) }
  else if(opts.back&&!m){ requestAnimationFrame(()=>scrollTo(0,homeScroll)) }
  else if(!opts.keep){ scrollTo(0,0) }
}

/* ---------- home ---------- */
function renderHome(){
  const L=live(), f=L[0], cm=cats(), up=upcoming().slice(0,4), s=S.settings;
  const reads=L.reduce((a,p)=>a+(p.views||0),0), lastIssue=Math.max(0,...L.map(p=>p.issue||0));
  setMeta(`${s.blogName} — ${s.tagline.replace(/\.$/,'')}`, s.tagline);
  const tick=L.slice(0,10).map(p=>`<a href="${postUrl(p)}" data-link><b>⬢ ${p.issue?'#'+p.issue:''}</b> ${esc(p.title)}</a>`).join('');
  $('#view').innerHTML=`
  <section class="hero"><div class="glow" style="width:320px;height:320px;background:#C9A86A;top:-90px;left:-90px"></div><div class="glow" style="width:300px;height:300px;background:#2d9b9d;bottom:-90px;right:10%"></div>
   <div class="in"><div>
    <span class="kicker"><i></i> New issue every ${DAYS[s.weeklyDay]}</span>
    <h1>Practical finance,<br><span>one insight</span> a week.</h1>
    <p class="lead">${esc(s.tagline)} FP&amp;A, controls, month-end close, AI in finance and career growth — written for people who do the work.</p>
    <div class="stats"><div><b>${lastIssue||L.length}</b><span>Latest issue</span></div><div><b>${L.length}</b><span>Issues online</span></div><div><b>${Object.keys(cm).length}</b><span>Topics</span></div>${reads?`<div><b>${reads.toLocaleString()}</b><span>Reads</span></div>`:''}</div>
   </div>
   ${f?`<a class="featured" href="${postUrl(f)}" data-link>${coverHTML(f)}<div class="body">
     <div class="meta"><b>LATEST ISSUE</b><span class="dot"></span>${fmtD(f.publishAt)}<span class="dot"></span>${readTime(f.content)} min read</div>
     <h2>${esc(f.title)}</h2><p>${esc(f.excerpt)}</p></div></a>`:'<div class="empty">The first issue is on its way.</div>'}
  </div></section>
  ${L.length>2?`<div class="ticker" aria-hidden="true"><div class="track">${tick}${tick}</div></div>`:''}
  <section class="home"><div id="issues">
    <div class="sec-h"><h3>All issues</h3><small id="count"></small></div>
    <div class="toolbar">${['All',...Object.keys(cm)].map(c=>`<button class="chip ${filter===c?'on':''}" data-cat="${esc(c)}" onclick="setFilter(this.dataset.cat)">${c!=='All'?`<i style="background:${catColor(c)}"></i>`:''}${esc(c)}</button>`).join('')}
      <label class="search">${SEARCH_ICON}<input type="search" placeholder="Search issues…" aria-label="Search issues" value="${esc(query)}" oninput="query=this.value;shown=PAGE;renderGrid()"></label></div>
    <div class="grid" id="grid"></div><div class="more" id="more"></div></div>
   <aside class="side">
    <div class="box brandbox">${markSVG()}<b style="letter-spacing:2px;font-weight:900">FINANCE INSIGHTS</b><p>A new practical issue every ${DAYS[s.weeklyDay]}. Join the newsletter on LinkedIn.</p>
      <a class="li-cta" href="${esc(s.linkedin)}" target="_blank" rel="noopener">${LI_ICON} Subscribe on LinkedIn</a></div>
    ${s.showUpcoming&&up.length?`<div class="box"><h5>Coming up</h5>${up.map(p=>{const d=new Date(p.publishAt);return `<div class="up-item"><div class="up-date"><span>${d.toLocaleDateString('en-GB',{month:'short'})}</span><b>${d.getDate()}</b></div><div><p>${esc(p.title)}</p><small>${p.issue?'Issue '+p.issue+' · ':''}${esc(p.category)} · ${countdown(p.publishAt)}</small></div></div>`}).join('')}</div>`:''}
    <div class="box" id="topics"><h5>Topics</h5>${Object.entries(cm).map(([c,n])=>`<button class="topic-row" data-cat="${esc(c)}" onclick="setFilter(this.dataset.cat,true)"><span style="background:none;padding:0;font-size:14px;font-weight:600"><i style="background:${catColor(c)}"></i>${esc(c)}</span><span>${n}</span></button>`).join('')}</div>
    <div class="box"><div class="author"><div class="avatar">${initials(s.author)}</div><div><b>${esc(s.author)}</b><small>${esc(s.role)}</small></div></div></div>
   </aside></section>`;
  renderGrid();
}
function setFilter(c,jump){filter=c;shown=PAGE;$$('.chip').forEach(b=>b.classList.toggle('on',b.dataset.cat===c));renderGrid();if(jump)document.getElementById('issues').scrollIntoView({behavior:'smooth'})}
function renderGrid(){
  const q=query.toLowerCase().trim();
  const L=live().filter(p=>(filter==='All'||p.category===filter)&&(!q||(p.title+' '+p.excerpt+' '+(p.tags||[]).join(' ')+' '+p.category+' '+(p.issue||'')).toLowerCase().includes(q)));
  $('#count').textContent=`${L.length} issue${L.length===1?'':'s'}`;
  $('#grid').innerHTML=L.length?L.slice(0,shown).map(cardHTML).join(''):'<div class="empty">No issues match your search.</div>';
  $('#more').innerHTML=L.length>shown?`<button class="btn" onclick="shown+=${PAGE};renderGrid()">Load more issues (${L.length-shown} more)</button>`:'';
}
const cardHTML=p=>`<a class="card" href="${postUrl(p)}" data-link>${coverHTML(p)}<div class="body">
  <div class="meta">${p.issue?`<b>ISSUE ${p.issue}</b><span class="dot"></span>`:''}${fmtD(p.publishAt)}<span class="dot"></span>${readTime(p.content)} min</div>
  <h4>${esc(p.title)}</h4><p>${esc(p.excerpt)}</p>
  <div class="foot"><span>${(p.tags||[]).filter(t=>t!=='FinanceInsights').slice(0,2).map(t=>'#'+esc(t)).join(' ')}</span>${p.views?`<span>◉ ${p.views}</span>`:''}</div></div></a>`;

/* ---------- article ---------- */
function renderPost(slug){
  const params=new URLSearchParams(location.search); let p=null, preview=false;
  if(params.has('preview')){ try{const d=JSON.parse(localStorage.getItem('fi_preview'));if(d&&(d.slug===slug||slug==='draft')){p=d;preview=true}}catch(e){} }
  if(!p) p=S.posts.find(x=>x.slug===slug||x.id===slug);
  if(p&&!preview&&!isLive(p)){ if(AUTH.isAdmin) preview=true; else p=null }
  if(!p) return renderNotFound(true);
  if(!preview) DB.view(p);
  const s=S.settings, L=live(), i=L.findIndex(x=>x.id===p.id), newer=i>=0?L[i-1]:null, older=i>=0?L[i+1]:null;
  const {html,toc}=md(p.content);
  const rel=[...L.filter(x=>x.id!==p.id&&x.category===p.category),...L.filter(x=>x.id!==p.id&&x.category!==p.category)].slice(0,3);
  setMeta(`${p.title} — ${s.blogName}`, p.excerpt);
  $('#view').innerHTML=`${preview?`<div class="banner">Preview — this issue is ${p.status==='scheduled'?'scheduled for '+fmtDT(p.publishAt):'not published yet'}. Only you can see it.</div>`:''}
  <div class="art-wrap"><article class="article" id="article">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="/" data-link>Finance Insights</a><span>›</span><span>${esc(p.category)}</span>${p.issue?`<span>›</span><span>Issue ${p.issue}</span>`:''}</nav>
    ${coverHTML(p)}
    <div class="meta">${p.issue?`<b>ISSUE ${p.issue}</b><span class="dot"></span>`:''}${esc(p.category)}<span class="dot"></span>${p.publishAt?fmtD(p.publishAt):'Draft'}<span class="dot"></span>${readTime(p.content)} min read</div>
    <h1 dir="auto">${esc(p.title)}</h1><p class="excerpt" dir="auto">${esc(p.excerpt)}</p>
    <div class="author"><div class="avatar">${initials(s.author)}</div><div><b>${esc(s.author)}</b><small>${esc(s.role)}</small></div></div>
    <div class="prose" dir="auto">${html}</div>
    <div class="tags">${(p.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div>
    <div class="share"><b>Share this issue</b>
      <a class="sbtn li" target="_blank" rel="noopener" href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(location.origin+postUrl(p))}">${LI_ICON} LinkedIn</a>
      <button class="sbtn" onclick="navigator.clipboard.writeText('${location.origin}${postUrl(p)}');toast('Link copied')">🔗 Copy link</button></div>
    <section class="subscribe">${markSVG()}<div><h4>Enjoyed this issue?</h4><p>Get the next Finance Insights issue every ${DAYS[s.weeklyDay]} — subscribe to the newsletter on LinkedIn.</p></div>
      <a class="btn gold" href="${esc(s.linkedin)}" target="_blank" rel="noopener">${LI_ICON} Subscribe</a></section>
    ${rel.length?`<section class="related"><h3>Keep reading</h3><div class="grid">${rel.map(cardHTML).join('')}</div></section>`:''}
    <nav class="navpair" aria-label="More issues">${older?`<a href="${postUrl(older)}" data-link><small>← Previous issue</small><p>${esc(older.title)}</p></a>`:'<span></span>'}
      ${newer?`<a href="${postUrl(newer)}" data-link style="text-align:right"><small>Next issue →</small><p>${esc(newer.title)}</p></a>`:''}</nav>
  </article>
  ${toc.length>2?`<aside class="toc" aria-label="In this issue"><h6>In this issue</h6>${toc.map(t=>`<a href="#${t.id}" class="l${t.level}" data-id="${t.id}">${esc(t.text)}</a>`).join('')}<div class="rt">${readTime(p.content)} min read · ${words(p.content).toLocaleString()} words</div></aside>`:''}</div>`;
  $$('.toc a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();document.getElementById(a.dataset.id)?.scrollIntoView({behavior:'smooth'});history.replaceState(null,'',location.pathname+location.search+'#'+a.dataset.id)}));
  if(toc.length>2&&'IntersectionObserver' in window){
    spy=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){$$('.toc a').forEach(a=>a.classList.toggle('on',a.dataset.id===e.target.id))}})},{rootMargin:'-90px 0px -70% 0px'});
    toc.forEach(t=>{const h=document.getElementById(t.id);if(h)spy.observe(h)});
  }
  if(AUTH.isAdmin&&p.id){const b=$('#editBtn');b.href='/admin/#/edit/'+p.id;b.style.display='grid'}
  if(location.hash&&location.hash.length>1){requestAnimationFrame(()=>document.getElementById(location.hash.slice(1))?.scrollIntoView())}
}
function renderNotFound(post){ setMeta('Not found — Finance Insights');
  $('#view').innerHTML=`<div class="nf">${markSVG()}<h1>${post?'Issue not available':'Page not found'}</h1><p>${post?'This issue has not been published yet, or the link has changed.':'The page you are looking for does not exist.'}</p><a class="btn gold" href="/" data-link>← Browse all issues</a></div>` }

/* ---------- reading progress + back to top (no auto refresh while reading) ---------- */
addEventListener('scroll',()=>{
  $('#topBtn').classList.toggle('show',scrollY>700);
  const a=$('#article'); if(!a){$('#progress').style.width='0';return}
  const r=a.getBoundingClientRect(), total=a.offsetHeight-innerHeight*.6;
  $('#progress').style.width=Math.min(100,Math.max(0,(-r.top+90)/total*100))+'%';
},{passive:true});

(async()=>{
  try{ await DB.init(); await DB.load() }catch(e){ console.error(e); toast('⚠ Could not load issues — please refresh') }
  renderShell(); render({keep:!!location.hash});
})();
</script>
</body>
</html>
